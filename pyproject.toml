[project]
name = "pawangunjkar-deps-mcp"
version = "1.0.0"
description = "MCP server for dependency and CVE checks across npm, Maven, and Python projects"
requires-python = ">=3.10"
authors = [{ name = "Pawan Gunjkar", email = "pawangunjkar@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
keywords = ["mcp", "dependencies", "cve", "npm", "maven", "pip"]
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
pawangunjkar-deps-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
